[package]
name = "markdown-syntax"
version = "0.7.2"
edition = "2021"
rust-version = "1.82"
description = "no_std + alloc Markdown syntax parser and serializer"
homepage = "https://github.com/plimeor/markdown-syntax"
repository = "https://github.com/plimeor/markdown-syntax"
license = "MIT OR Apache-2.0"
keywords = ["markdown", "commonmark", "gfm", "parser", "ast"]
categories = ["parser-implementations", "text-processing", "no-std"]

# The published package ships only the library, license, and readme. The vendored
# conformance corpus under tests/ is dev-only and is intentionally NOT
# redistributed (it contains third-party CommonMark/GFM/comrak/markdown-rs cases).
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**",
]

[lib]
name = "markdown_syntax"
path = "src/lib.rs"

# The WebAssembly binding is a member; the root package stays the default, so
# `cargo build` and `cargo test` at the root build only the core crate.
[workspace]
members = ["wasm"]
default-members = ["."]

[features]
default = []
html = []

# Build docs.rs with the html feature so the renderer API is documented there.
[package.metadata.docs.rs]
features = ["html"]

# The profile CI runs the test suite under: optimized like release, with the
# debug assertions and integer overflow checks a debug build has. It does not
# affect the published crate.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true

# The WebAssembly binding's build: small, and a panic aborts, which the core
# crate's infallible entry points rule out for valid calls.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
