name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      # Default features: the zero-dependency gate.
      - run: cargo build
      # Default features compile the tests without running them; with the
      # `html` feature the same tests run once below, along with the HTML ones.
      - run: cargo test --no-run
      - run: cargo test --profile ci --features html
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: wasm binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The encoding's unit tests run on the host.
      - run: cargo test -p markdown-syntax-wasm
      - run: cargo build -p markdown-syntax-wasm --target wasm32-unknown-unknown --profile wasm
      - run: node --test 'wasm/js/test/*.test.mjs'

# Deferred — NOT gates yet:
#  - `cargo clippy -- -D warnings`: the crate has pre-existing clippy warnings;
#    clean them before adding this as a blocking gate.
